name: Cortes Enel cada 6 h

on:
  schedule:
    # Cron en UTC: 00:05, 06:05, 12:05 y 18:05 en Chile con horario de verano
    # (UTC-3). Con horario de invierno (UTC-4) corre una hora antes.
    - cron: "5 3,9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enel
  cancel-in-progress: false

jobs:
  enel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Comunas afectadas
        run: python enel_cortes_comunas.py

      - name: Mapa de cortes
        run: python mapa_cortes_esri.py

      - name: Guardar
        run: |
          bash .github/scripts/guardar.sh \
            "Enel: lectura $(TZ=America/Santiago date '+%Y-%m-%d %H:%M')" \
            enel_comunas.csv mapas
