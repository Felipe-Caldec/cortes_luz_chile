name: Cortes CGE – reintento cada 30 min

# Solo corre mientras CGE esté caído: cge.yml lo activa cuando una lectura
# falla y este workflow se desactiva solo al conseguir datos. Mientras está
# desactivado no gasta minutos de Actions.
#
# Al subirlo queda activo: su primera ejecución hace una lectura normal y,
# si funciona, se desactiva. No hay que hacer nada a mano.
on:
  schedule:
    - cron: "20,50 * * * *"   # cada 30 min, desfasado del horario fijo (:35)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: cge
  cancel-in-progress: false

jobs:
  cge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lectura CGE
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/cge.sh
